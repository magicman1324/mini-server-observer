version: '3.8'

services:
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    ports:
      - "9100:9100"
    environment:
      - HYDRA_LISTEN_ADDR=:9100
      - HYDRA_REGION=default
    restart: unless-stopped

  regional:
    build:
      context: ./backend
      dockerfile: Dockerfile.regional
    environment:
      - HYDRA_REGION=default
      - HYDRA_SCRAPE_INTERVAL=15s
      - HYDRA_GRPC_PORT=50051
      - HYDRA_CENTRAL_ADDR=central:50051
    depends_on:
      - agent
      - central
    restart: unless-stopped

  central:
    build:
      context: ./backend
      dockerfile: Dockerfile.central
    ports:
      - "8080:8080"
    environment:
      - HYDRA_LISTEN_ADDR=:8080
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - central
    restart: unless-stopped
