apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: hydra
spec:
  selector:
    app: hydra-frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hydra-frontend
  namespace: hydra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hydra-frontend
  template:
    metadata:
      labels:
        app: hydra-frontend
    spec:
      containers:
        - name: frontend
          image: hydra-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
